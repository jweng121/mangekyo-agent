name: Release Windows executable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install ".[tui,evidence]" pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python scripts/build_standalone.py
      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/mangekyo.exe release/mangekyo-windows-x64.exe
          $hash = (Get-FileHash release/mangekyo-windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  mangekyo-windows-x64.exe" | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/mangekyo-windows-x64.exe release/SHA256SUMS.txt --verify-tag --title "Mangekyo ${{ github.ref_name }}" --generate-notes
