name: LangGraph integration tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e ".[tui,evidence,langgraph]" pytest
      - name: Run deterministic tests
        run: python -m pytest tests -q
